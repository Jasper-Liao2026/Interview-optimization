[project]
name = "resume-optimizer-api"
version = "0.1.0"
description = "简历优化器后端 —— 业务逻辑与 agent 编排"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    # LLM 走 OpenAI 兼容协议，用 httpx 直接发请求：
    # 不引入 provider 专有 SDK，换 DeepSeek / Moonshot / 通义 / vLLM 只改 base_url
    "httpx>=0.27.2",
    # 观测：M0-8 起接入。与服务端同主版本（本地实例跑 langfuse/langfuse:3）
    "langfuse>=3.0.0,<4",
    # 简历 HTML 渲染（M1-5）。选 Jinja2 而不是 f-string 拼模板：
    # 它默认支持自动转义，用户输入的经历文本不会被当成 HTML 注入进去。
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",  # FastAPI 的 Depends() 默认值写法
    # RUF001/002/003 把中文全角标点（，：；（））判为「易混淆字符」。
    # 本项目的文档串、注释、给用户看的字段描述都是中文，全角标点是正确写法，
    # 逐条加 noqa 只会把配置搞脏，因此整体关闭。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------ pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
