# 本地一键拉起 web + api + postgres（M0-4 验收）
#
# 日常开发建议：只起基础设施 —— `docker compose up -d postgres api`，
#   然后把前端跑在宿主机（`pnpm web`），这样前端热更新最快。
# 需要验证「一键全起」时再 `docker compose up --build`。

name: resume-optimizer

services:
  # ------------------------------------------------------------ postgres
  postgres:
    # 选 pgvector 镜像而不是官方 postgres：M3-4 要存经历向量，
    # 提前用同一个镜像可以避免「开发用 pg16、上线换成 pgvector」的环境漂移
    image: pgvector/pgvector:pg16
    container_name: resume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_optimizer
      # 中文排序与大小写行为显式固定，避免不同机器 initdb 结果不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 宿主端口刻意选 54322 而不是 5432：避开本机可能已有的 Postgres，
      # 也让「这个库属于本项目」一眼可辨（重建卷 = down -v 后重放下面的 SQL）
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d 只在数据目录为空时执行，
      # 且**不会递归子目录**，所以必须逐个文件挂载。
      # 改了 SQL 想重放：`pnpm db:reset`（= docker compose down -v postgres）
      - ./supabase/migrations/20261008000000_init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./supabase/migrations/20261009000000_m1_core.sql:/docker-entrypoint-initdb.d/11-m1-core.sql:ro
      - ./supabase/migrations/20261010000000_m2_library.sql:/docker-entrypoint-initdb.d/12-m2-library.sql:ro
      - ./supabase/migrations/20261011000000_m3_matching.sql:/docker-entrypoint-initdb.d/13-m3-matching.sql:ro
      - ./supabase/migrations/20261012000000_m4_generation.sql:/docker-entrypoint-initdb.d/14-m4-generation.sql:ro
      - ./supabase/migrations/20261013000000_m5_scoring.sql:/docker-entrypoint-initdb.d/15-m5-scoring.sql:ro
      - ./supabase/migrations/20261014000000_m6_editing.sql:/docker-entrypoint-initdb.d/16-m6-editing.sql:ro
      - ./supabase/migrations/20261015000000_m8_evaluation.sql:/docker-entrypoint-initdb.d/17-m8-evaluation.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_optimizer"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ----------------------------------------------------------------- api
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: resume-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: docker
      MILESTONE: M8
      PROMPT_VERSION: ${PROMPT_VERSION:-m4.0}
      LLM_INPUT_PRICE_PER_MILLION_USD: ${LLM_INPUT_PRICE_PER_MILLION_USD:-}
      LLM_OUTPUT_PRICE_PER_MILLION_USD: ${LLM_OUTPUT_PRICE_PER_MILLION_USD:-}
      LOG_LEVEL: INFO
      # 容器内走服务名，不走宿主机的 54322
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resume_optimizer
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      # 开发热重载：只挂 app 目录，不覆盖已装好的依赖
      - ./apps/api/app:/app/app
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 用 python 自带 urllib，镜像里不必再装 curl
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ----------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* 是**构建期**常量，会被内联进客户端 bundle，
        # 只能在 build 阶段传，运行时再给环境变量是无效的
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: resume-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ======================================================= 观测栈（M0-8）
  #
  # 用 profile 隔离：默认 `docker compose up` **不会**起这一坨（6 个容器太重），
  # 需要时显式指定 —— `docker compose --profile observability up -d`。
  #
  # 端口刻意错开宿主常用端口，避免和本项目的 web(3000) / postgres(54322) 打架：
  #   langfuse-web → 宿主 3300（容器内仍是 3000，Langfuse 自身依赖这个值）
  #   clickhouse / redis / minio / langfuse-postgres 一律不暴露到宿主，
  #   只走 compose 内部网络 —— 本地调试用不到它们。
  #
  # LANGFUSE_INIT_* 会在首次启动时自动建好组织/项目/用户并固定 API key，
  # 免去在 UI 里手动注册，也让 .env 里的 key 是确定值、可提交。
  # 若把这些端口暴露到公网，务必换成随机值（`openssl rand -hex 32`）。

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: resume-langfuse-postgres
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: resume-langfuse-clickhouse
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-redis:
    image: redis:7-alpine
    container_name: resume-langfuse-redis
    profiles: [observability]
    restart: unless-stopped
    # 必须带密码：不带的话 redis-cli ping 会因 NOAUTH 失败，健康检查永远不过
    command: ["redis-server", "--requirepass", "myredissecret", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a myredissecret --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: resume-langfuse-minio
    profiles: [observability]
    restart: unless-stopped
    entrypoint: sh
    # 先建好 langfuse bucket 再启动，省掉一次手工操作
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio_data:/data
    # 刻意不写 healthcheck：minio 镜像里 curl/mc 是否可用随版本变化，
    # 一个永不通过的 healthcheck 会把整条依赖链卡死。langfuse 只等服务启动。

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: resume-langfuse-worker
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    environment: &langfuse-env
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
      SALT: resume-optimizer-local-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: myredissecret
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: resume-langfuse-web
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    ports:
      - "3300:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3300
      NEXTAUTH_SECRET: resume-optimizer-local-nextauth
      # 首次启动自动建组织 / 项目 / 用户，并固定 API key
      LANGFUSE_INIT_ORG_ID: resume-optimizer
      LANGFUSE_INIT_ORG_NAME: Resume Optimizer
      LANGFUSE_INIT_PROJECT_ID: resume-optimizer
      LANGFUSE_INIT_PROJECT_NAME: resume-optimizer
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_INIT_USER_EMAIL: dev@resume-optimizer.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: devpassword

volumes:
  pgdata:
  langfuse_pgdata:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:

