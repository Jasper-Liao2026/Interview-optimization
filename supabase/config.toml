# Supabase 本地实例配置（M0-5）
#
# 本机尚未安装 Supabase CLI，两种启用方式：
#   npx supabase start        # 零安装，走 npx
#   scoop install supabase    # 或 brew install supabase/tap/supabase
#
# 端口刻意与 docker-compose 的 postgres 对齐（54322），
# 两种跑法共用同一份 DATABASE_URL，切换配置的成本为零。

project_id = "resume-optimizer"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# 与 docker-compose 的 postgres 宿主端口一致
port = 54322
shadow_port = 54320
major_version = 16

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# 前后端共用这一份 JWT（tech-stack.md §6.3）：
# FastAPI 侧只校验签名，不自己签发 token
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# 本地开发关掉邮件确认，否则注册完还得去 inbucket 点链接
enable_confirmations = false

[analytics]
enabled = false
